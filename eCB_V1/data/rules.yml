# ============================================================================
# data/rules.yml 
# ============================================================================

version: "3.1"

rules:

# ═══════════════════════════════════════════════════════════════════════════════
#  CORE CONVERSATIONAL RULES
# ═══════════════════════════════════════════════════════════════════════════════

- rule: Greet the user
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Respond to thanks
  steps:
    - intent: thank_you
    - action: utter_you_are_welcome

- rule: Respond to affirm
  steps:
    - intent: affirm
    - action: utter_you_are_welcome

- rule: Respond to bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

# ═══════════════════════════════════════════════════════════════════════════════
#  PRE-PURCHASE INTELLIGENCE RULES (Search, Spec Comparison, Coupons)
# ═══════════════════════════════════════════════════════════════════════════════

- rule: Trigger product search action
  steps:
    - intent: search_product
    - action: action_search_product

- rule: Trigger side-by-side product comparison
  steps:
    - intent: compare_products
    - action: action_compare_products

- rule: Trigger promo coupon & eligibility engine
  steps:
    - intent: check_coupons
    - action: action_check_coupons

# ═══════════════════════════════════════════════════════════════════════════════
#  POST-PURCHASE SUPPORT RULES (Orders, Cancellation, Wallet, Tickets)
# ═══════════════════════════════════════════════════════════════════════════════

- rule: Trigger order status check action
  steps:
    - intent: check_order_status
    - action: action_check_order_status

- rule: Trigger smart order cancellation guardrail
  steps:
    - intent: cancel_order
    - action: action_cancel_order

- rule: Trigger Nova wallet balance check
  steps:
    - intent: check_wallet
    - action: action_check_wallet

- rule: Trigger support ticket & escalation action
  steps:
    - intent: support_ticket
    - action: action_support_ticket

# ═══════════════════════════════════════════════════════════════════════════════
#  RETURN FORM RULES
# ═══════════════════════════════════════════════════════════════════════════════

- rule: Activate order return form
  steps:
    - intent: request_return
    - action: order_return_form
    - active_loop: order_return_form

- rule: Submit return after form completion
  condition:
    - active_loop: order_return_form
  steps:
    - action: order_return_form
    - active_loop: null
    - action: action_submit_return

- rule: Cancel the return form
  condition:
    - active_loop: order_return_form
  steps:
    - intent: cancel
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_cancelled

- rule: Interrupt form with policy question
  condition:
    - active_loop: order_return_form
  steps:
    - intent: ask_policy
    - action: action_answer_faq

- rule: Trigger admin report generation
  steps:
    - intent: generate_admin_report
    - action: action_generate_admin_report

# ═══════════════════════════════════════════════════════════════════════════════
#  RAG POLICY, FALLBACK & OUT-OF-SCOPE RULES
# ═══════════════════════════════════════════════════════════════════════════════

- rule: Answer policy questions using RAG
  steps:
    - intent: ask_policy
    - action: action_answer_faq

- rule: Ask user to rephrase (NLU fallback)
  steps:
    - intent: nlu_fallback
    - action: utter_default

- rule: Handle out-of-scope questions
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope


