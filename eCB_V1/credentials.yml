# ============================================================================
# credentials.yml — Input Channel Credentials
# ============================================================================
# Defines which messaging channels (webhooks) the Rasa server accepts
# messages from.  Each key is a channel connector class.
#
# For this workshop demo we enable:
#   • rest  — A simple HTTP REST API for testing (curl / Postman / custom UI)
#
# The REST channel exposes:
#   POST http://localhost:5005/webhooks/rest/webhook
#   Body: {"sender": "user123", "message": "hello"}
#
# You can add more channels later:
#   • socketio (for a web chat widget)
#   • slack, telegram, facebook, etc.
# ============================================================================

# REST channel — no authentication required (suitable for local dev/demo)
rest:
  # No additional configuration needed for the REST channel.
  # It is enabled simply by listing it here.

# Socket.IO channel — uncomment to enable a real-time web chat widget
# socketio:
#   user_message_evt: user_uttered
#   bot_message_evt: bot_uttered
#   session_persistence: false
